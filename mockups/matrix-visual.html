<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eisenhower Matrix · Visual Draft</title>
<style>
  :root {
    color-scheme: light;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
  }

  body[data-palette="graphite"] {
    color-scheme: dark;
    --bg: #1A1D23;
    --surface: #22262E;
    --surface-raised: #2C333D;
    --card-bg: #2B313B;
    --matrix-bg: #242A33;
    --surface-muted: #262C35;
    --surface-muted-2: #333B47;
    --border: #3A414D;
    --border-strong: #4C5665;
    --text: #F1F4F8;
    --text-muted: #AFB8C5;
    --q1: #F04452; --q1-tint: rgba(240, 68, 82, .12);
    --q2: #0087EE; --q2-tint: rgba(0, 135, 238, .12);
    --q3: #FFB020; --q3-tint: rgba(255, 176, 32, .10);
    --q4: #7C8798; --q4-tint: rgba(124, 135, 152, .07);
    --important: #4EA8FF;
    --urgent: #FF6B70;
    --q1-glow: rgba(240, 68, 82, .18);
    --q2-glow: rgba(0, 135, 238, .16);
    --q3-glow: rgba(255, 176, 32, .12);
    --q4-glow: rgba(124, 135, 152, .08);
    --overdue: #FF7A7F; --overdue-bg: rgba(240, 68, 82, .16);
    --warning: #FFC857; --warning-bg: rgba(255, 176, 32, .14);
    --success: #3DDC97;
    --accent: #0087EE;
    --accent-contrast: #04121F;
    --card-shadow: rgba(0, 0, 0, .25);
    --card-shadow-hover: rgba(0, 0, 0, .36);
    --matrix-shadow: rgba(0, 0, 0, .35);
    --popover-shadow: rgba(0, 0, 0, .40);
    --sidebar-shadow: rgba(0, 0, 0, .36);
    --backdrop: rgba(0, 0, 0, .32);
    --dot-ring: #242A33;
    --toast-bg: #2C333D;
    --toast-text: #F1F4F8;
    --leader-opacity: .45;
  }

  body[data-palette="fog"] {
    color-scheme: light;
    --bg: #DCE2E9;
    --surface: #E9EDF3;
    --surface-raised: #F4F6F9;
    --card-bg: #F7F9FB;
    --matrix-bg: #E4E9F0;
    --surface-muted: #E1E6ED;
    --surface-muted-2: #D5DCE5;
    --border: #C5CEDA;
    --border-strong: #AEBAC9;
    --text: #1C2733;
    --text-muted: #5B6878;
    --q1: #E03A47; --q1-tint: rgba(224, 58, 71, .10);
    --q2: #007FD4; --q2-tint: rgba(0, 127, 212, .10);
    --q3: #E0A100; --q3-tint: rgba(224, 161, 0, .11);
    --q4: #8492A6; --q4-tint: rgba(132, 146, 166, .08);
    --important: #0069C2;
    --urgent: #C92A36;
    --q1-glow: rgba(224, 58, 71, .14);
    --q2-glow: rgba(0, 127, 212, .14);
    --q3-glow: rgba(224, 161, 0, .12);
    --q4-glow: rgba(132, 146, 166, .07);
    --overdue: #B42318; --overdue-bg: #F8DCDA;
    --warning: #B54708; --warning-bg: #F8E7C8;
    --success: #067647;
    --accent: #007FD4;
    --accent-contrast: #FFFFFF;
    --card-shadow: rgba(31, 45, 61, .12);
    --card-shadow-hover: rgba(31, 45, 61, .20);
    --matrix-shadow: rgba(31, 45, 61, .16);
    --popover-shadow: rgba(31, 45, 61, .22);
    --sidebar-shadow: rgba(31, 45, 61, .20);
    --backdrop: rgba(31, 45, 61, .22);
    --dot-ring: #E4E9F0;
    --toast-bg: #1C2733;
    --toast-text: #FFFFFF;
    --leader-opacity: .30;
  }



  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--q2-tint); }
  :focus-visible { outline: 2px solid var(--important); outline-offset: 2px; }

  .app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 1; }

  /* ---------- top bar ---------- */
  .topbar {
    height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: relative; z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 168px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
    padding: 4px; background: var(--text);
  }
  .brand-mark span { border-radius: 2px; background: var(--q1); }
  .brand-mark span:nth-child(2) { background: var(--q2); }
  .brand-mark span:nth-child(3) { background: var(--q4); }
  .brand-mark span:nth-child(4) { background: var(--q3); }
  .brand h1 { font-size: 14.5px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .brand p { font-size: 10.5px; color: var(--text-muted); margin: 2px 0 0; }

  .search {
    margin-left: 4px; width: 224px; height: 34px; display: flex; align-items: center;
    gap: 8px; padding: 0 10px; border: 1px solid transparent; background: var(--surface-muted);
    border-radius: 9px; color: var(--text-muted); transition: background .15s, border-color .15s;
  }
  .search:focus-within { background: var(--surface-raised); border-color: var(--border-strong); }
  .search svg { flex: 0 0 13px; width: 13px; height: 13px; }
  .search input { border: 0; background: transparent; outline: 0; width: 100%; font-size: 13px; }
  .search input::placeholder { color: var(--text-muted); opacity: .8; }

  .tag-filters { display: flex; gap: 5px; align-items: center; }
  .tag-chip {
    height: 26px; border: 1px solid transparent; background: var(--surface-muted);
    border-radius: 999px; padding: 0 9px; font-size: 11px; color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 5px; transition: all .15s;
  }
  .tag-chip i { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .tag-chip.active { background: var(--surface-raised); border-color: var(--border-strong); color: var(--text); }

  .tabs { margin-left: auto; display: flex; background: var(--surface-muted); border-radius: 9px; padding: 3px; gap: 2px; }
  .tab {
    height: 28px; border: 0; background: transparent; padding: 0 9px; border-radius: 7px;
    font-size: 11px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px;
  }
  .tab.active { background: var(--surface-raised); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px var(--card-shadow); }
  .tab .count {
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    background: var(--surface-muted-2); font-size: 9px; display: grid; place-items: center;
  }
  .tab.active .count { background: var(--surface-muted); }

  .add-btn {
    height: 34px; border: 0; background: var(--accent); color: var(--accent-contrast); border-radius: 9px;
    padding: 0 12px; font-size: 12px; font-weight: 700; display: inline-flex;
    align-items: center; gap: 6px; transition: opacity .15s;
  }
  .add-btn:hover { opacity: .88; }
  .icon-btn {
    width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 9px; display: grid; place-items: center; color: var(--text-muted);
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--text); }

  /* ---------- workspace ---------- */
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  .matrix-wrap { position: relative; min-width: 0; min-height: 0; padding: 36px 36px 44px 60px; background: var(--bg); }

  .axis { pointer-events: none; color: var(--text-muted); }
  .axis-y { position: absolute; left: 10px; top: 36px; bottom: 44px; width: 42px; }
  .axis-y .axis-title {
    position: absolute; top: 50%; left: 2px; transform: translateY(-50%) rotate(-90deg);
    transform-origin: left center; font-size: 11px; font-weight: 600;
    letter-spacing: .02em; color: var(--important); white-space: nowrap;
  }
  .axis-y .arrow {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--important); line-height: 1;
  }
  .axis-y .tick { position: absolute; right: 0; font-size: 10px; font-variant-numeric: tabular-nums; }
  .axis-y .tick.top { top: -3px; }
  .axis-y .tick.mid { top: 50%; transform: translateY(-50%); }
  .axis-y .tick.bottom { bottom: -3px; }

  .axis-x { position: absolute; left: 60px; right: 36px; bottom: 6px; height: 32px; }
  .axis-x .ticks { position: absolute; top: 0; left: 0; right: 0; height: 12px; }
  .axis-x .tick { position: absolute; font-size: 10px; font-variant-numeric: tabular-nums; }
  .axis-x .tick.left { left: 0; }
  .axis-x .tick.mid { left: 50%; transform: translateX(-50%); }
  .axis-x .tick.right { right: 0; }
  .axis-x .axis-title {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--urgent); white-space: nowrap;
  }

  .matrix {
    position: relative; width: 100%; height: 100%; background: var(--matrix-bg);
    border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 48px var(--matrix-shadow);
  }

  .quad-bg { position: absolute; transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease; }
  .q1-bg { background: var(--q1-tint); }
  .q2-bg { background: var(--q2-tint); }
  .q3-bg { background: var(--q3-tint); }
  .q4-bg { background: var(--q4-tint); }

  .crosshair { position: absolute; background: var(--border-strong); z-index: 2; transition: left .2s ease, top .2s ease; }
  .crosshair.v { top: 0; bottom: 0; width: 1px; }
  .crosshair.h { left: 0; right: 0; height: 1px; }

  .quad-label {
    position: absolute; z-index: 8; display: flex; gap: 9px; padding: 15px 18px;
    pointer-events: none; width: 250px; transition: width .2s ease; overflow: hidden;
  }
  .quad-label.tl { left: 0; top: 0; }
  .quad-label.tr { right: 0; top: 0; flex-direction: row-reverse; text-align: right; }
  .quad-label.bl { left: 0; bottom: 0; }
  .quad-label.br { right: 0; bottom: 0; flex-direction: row-reverse; text-align: right; }
  .quad-accent { flex: 0 0 3px; width: 3px; border-radius: 2px; background: var(--q); box-shadow: 0 0 8px var(--q-glow); align-self: stretch; min-height: 28px; }
  .quad-copy { min-width: 0; }
  .quad-title-row { display: flex; align-items: center; gap: 7px; }
  .quad-label.tr .quad-title-row, .quad-label.br .quad-title-row { justify-content: flex-end; }
  .quad-label h2 { font-size: 13.5px; font-weight: 700; margin: 0; letter-spacing: .01em; white-space: nowrap; }
  .quad-label p { margin: 3px 0 0; font-size: 10.5px; line-height: 1.4; color: var(--text-muted); white-space: nowrap; }
  .quad-label.compact p { display: none; }
  .quad-count {
    font-size: 9.5px; line-height: 1; padding: 3px 6px; border-radius: 999px;
    background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-muted);
    font-weight: 600; font-variant-numeric: tabular-nums;
  }

  .q1 { --q: var(--q1); }
  .q2 { --q: var(--q2); }
  .q3 { --q: var(--q3); }
  .q4 { --q: var(--q4); }

  .leaders { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: visible; }
  .leader { stroke-width: 1; stroke-opacity: var(--leader-opacity); }
  .leader.q1 { stroke: var(--q1); }
  .leader.q2 { stroke: var(--q2); }
  .leader.q3 { stroke: var(--q3); }
  .leader.q4 { stroke: var(--q4); }
  .anchor { stroke: var(--matrix-bg); stroke-width: 1.5; }
  .anchor.q1 { fill: var(--q1); }
  .anchor.q2 { fill: var(--q2); }
  .anchor.q3 { fill: var(--q3); }
  .anchor.q4 { fill: var(--q4); }

  .items-layer { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- task cards ---------- */
  .task-card {
    --card-glow: transparent;
    position: absolute; pointer-events: auto; background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 11px; padding: 10px 12px 9px 13px;
    box-shadow: 0 2px 6px var(--card-shadow), 0 6px 18px var(--card-glow);
    cursor: pointer; user-select: none;
    transition: box-shadow .16s ease, transform .16s ease;
    overflow: hidden;
  }
  .task-card::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
    border-radius: 2px; background: var(--q); box-shadow: 0 0 10px var(--q-glow);
  }
  .task-card.q1 { --card-glow: var(--q1-glow); background: linear-gradient(90deg, var(--q1-glow), transparent 38%), var(--card-bg); }
  .task-card.q2 { --card-glow: var(--q2-glow); background: linear-gradient(90deg, var(--q2-glow), transparent 38%), var(--card-bg); }
  .task-card.q3 { --card-glow: var(--q3-glow); }
  .task-card.q4 { --card-glow: var(--q4-glow); }
  .task-card.q1::before, .task-card.q2::before { width: 4px; }
  .task-card:hover { box-shadow: 0 10px 26px var(--card-shadow-hover), 0 0 24px var(--card-glow); transform: translateY(-1px); }
  .task-card.selected { box-shadow: 0 0 0 2px var(--text), 0 10px 26px var(--card-shadow-hover), 0 0 24px var(--card-glow); }
  .task-card.lg { min-height: 0; }
  .task-card.md { min-height: 0; }
  .task-card.sm { min-height: 0; }
  .matrix.narrow .task-card { padding: 9px 10px 8px 11px; }
  .matrix.narrow .task-card::before { top: 7px; bottom: 7px; }
  .matrix.narrow .task-card h3 { font-size: 12.4px; line-height: 1.35; }
  .matrix.narrow .card-meta { margin-top: 5px; min-height: 13px; gap: 5px; }
  .matrix.narrow .due { height: 17px; font-size: 9.5px; }
  .matrix.narrow .complete-btn { width: 20px; height: 20px; flex-basis: 20px; font-size: 12px; }
  .matrix.narrow .quad-label { padding: 10px 14px; }
  .matrix.narrow .quad-label p { display: none; }

  .card-top { display: flex; align-items: flex-start; gap: 4px; }
  .task-card h3 {
    flex: 1; margin: 0; font-size: 13.4px; line-height: 1.4; font-weight: 600;
    letter-spacing: .005em; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-card.sm h3 { -webkit-line-clamp: 1; }
  .complete-btn {
    flex: 0 0 22px; width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: transparent; color: var(--text-muted); font-size: 13px; line-height: 1;
    display: grid; place-items: center; opacity: .35; transition: all .15s; padding: 0;
  }
  .task-card:hover .complete-btn { opacity: 1; }
  .complete-btn:hover { background: var(--surface-muted); color: var(--success); }

  .card-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; min-height: 18px; }
  .due {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
    border-radius: 999px; font-size: 10px; font-weight: 600; white-space: nowrap;
    color: var(--text-muted); background: var(--surface-muted);
  }
  .due.overdue { color: var(--overdue); background: var(--overdue-bg); }
  .due.soon { color: var(--warning); background: var(--warning-bg); }
  .tag-dots { display: flex; align-items: center; gap: 3px; }
  .tag-dots i { display: block; width: 5px; height: 5px; border-radius: 50%; }
  .score-mini {
    margin-left: auto; font-size: 9.5px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .78;
  }
  .task-card.md .score-mini, .task-card.sm .score-mini { display: none; }
  .matrix.narrow .score-mini { display: none; }

  /* ---------- unimportant dots & clusters ---------- */
  .dot-hit {
    position: absolute; width: 24px; height: 24px; padding: 0; border: 0;
    background: transparent; display: grid; place-items: center; cursor: pointer;
    z-index: 18;
  }
  .micro-dot {
    display: block; border-radius: 50%; background: var(--q);
    border: 2px solid var(--dot-ring); box-shadow: 0 0 0 1px var(--border-strong), 0 0 10px var(--q-glow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .dot-hit:hover .micro-dot {
    transform: scale(1.6);
    box-shadow: 0 2px 8px var(--card-shadow-hover), 0 0 0 1px var(--border-strong), 0 0 12px var(--q-glow);
  }
  .dot-hit.selected .micro-dot { box-shadow: 0 0 0 2px var(--text), 0 0 0 4px var(--matrix-bg); }

  .cluster {
    position: absolute; height: 32px; min-width: 48px; padding: 0 9px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface-raised);
    box-shadow: 0 3px 10px var(--card-shadow);
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 11px; font-weight: 700; color: var(--text); cursor: pointer; z-index: 16;
    transition: transform .15s ease, box-shadow .15s ease; white-space: nowrap;
  }
  .cluster:hover { transform: scale(1.06); box-shadow: 0 8px 20px var(--card-shadow-hover); }
  .cluster .urgent-dot, .cluster .overdue-dot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 5px; }
  .cluster .urgent-dot { background: var(--urgent); box-shadow: 0 0 7px var(--q1-glow); }
  .cluster .overdue-dot { background: var(--overdue); }
  .cluster .cluster-label { font-variant-numeric: tabular-nums; }

  /* ---------- popover / tooltip / toast ---------- */
  .popover-backdrop { position: absolute; inset: 0; z-index: 180; background: transparent; }
  .cluster-popover {
    position: absolute; z-index: 190; width: 320px; max-height: 300px; overflow: auto;
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: 13px;
    box-shadow: 0 18px 44px var(--popover-shadow); padding: 8px;
  }
  .cluster-popover header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .cluster-popover header strong { font-size: 12.5px; }
  .cluster-popover header span { font-size: 10.5px; color: var(--text-muted); }
  .popover-item {
    width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 8px;
    border-radius: 8px; display: flex; flex-direction: column; gap: 2px; cursor: pointer;
  }
  .popover-item:hover { background: var(--surface-muted); }
  .popover-item .pi-title { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .popover-item .pi-meta { font-size: 10.5px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }

  .tooltip {
    position: fixed; z-index: 500; max-width: 260px; background: var(--toast-bg); color: var(--toast-text);
    border-radius: 9px; padding: 8px 10px; font-size: 11.5px; line-height: 1.5;
    box-shadow: 0 10px 28px rgba(0,0,0,.32); opacity: 0; visibility: hidden;
    pointer-events: none; transition: opacity .1s ease;
  }
  .tooltip .tt-title { font-weight: 700; margin-bottom: 3px; font-size: 12px; }
  .tooltip .tt-meta { color: rgba(255,255,255,.72); }
  .tooltip .tt-list { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; gap: 3px; }
  .tooltip .tt-list div { display: flex; justify-content: space-between; gap: 8px; color: rgba(255,255,255,.9); }
  .tooltip .tt-list span { color: rgba(255,255,255,.55); white-space: nowrap; }
  .tooltip .tt-foot { margin-top: 5px; color: rgba(255,255,255,.55); font-size: 9.5px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    z-index: 700; background: var(--toast-bg); color: var(--toast-text); padding: 9px 15px;
    border-radius: 9px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.32);
    opacity: 0; visibility: hidden; transition: all .18s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  /* ---------- sidebar ---------- */
  .sidebar {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 18px; scrollbar-width: thin;
  }
  .sidebar-backdrop { display: none; }
  .sidebar-close { display: none; }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid var(--surface); }

  .panel {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    background: var(--surface);
  }
  .panel + .panel { margin-top: 14px; }
  .panel h3 { font-size: 12.5px; margin: 0 0 5px; letter-spacing: .01em; color: var(--text); }
  .panel p { font-size: 11.5px; line-height: 1.6; color: var(--text-muted); margin: 0; }
  .panel-sub { margin-top: -2px !important; margin-bottom: 10px !important; font-size: 10.5px !important; }

  .palette-switch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 10px; }
  .palette-btn {
    border: 1px solid var(--border); background: var(--surface-muted); border-radius: 9px;

    { id: "t16", title: "Buy coffee beans",          importance: 8,  urgency: 75, due: "2026-10-19", tags: ["Life"],              notes: "" },

  ];

  const state = {
    tasks: TASKS.map(t => ({ ...t, status: "active" })),
    threshold: 50,
    palette: "graphite",
    selectedId: null,
    openClusterId: null
  };

  /* ============================================================
     Small helpers
     ============================================================ */
  const $ = (sel, root = document) => root.querySelector(sel);
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const roundScore = v => clamp(Math.round(Number(v) || 0), 0, 100);
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  const QUADS = {
    1: { key: "q1", name: "Do now", hint: "Handle today · keep it small" },
    2: { key: "q2", name: "Schedule", hint: "Highest leverage · protect time" },
    3: { key: "q3", name: "Batch", hint: "Clear in batches · delete what you can" },
    4: { key: "q4", name: "Drop", hint: "Delete or let go" }
  };

  function quadrantOf(task, threshold = state.threshold) {
    const important = task.importance >= threshold;
    const urgent = task.urgency >= threshold;
    return important ? (urgent ? 1 : 2) : (urgent ? 3 : 4);
  }

  function isOverdue(task) {
    if (!task.due) return false;
    return new Date(task.due + "T00:00:00") < TODAY;
  }

  function dueInfo(task) {
    if (!task.due) return null;
    if (task.status === "completed") return { text: task.due.slice(5).replace("-", "/"), cls: "" };
    const due = new Date(task.due + "T00:00:00");
    const diff = Math.round((due - TODAY) / 86400000);
    if (diff < 0) return { text: `Overdue ${-diff}d`, cls: "overdue" };
    if (diff === 0) return { text: "Today", cls: "soon" };
    if (diff <= 3) return { text: `${diff}d left`, cls: "soon" };
    return { text: task.due.slice(5).replace("-", "/"), cls: "" };
  }

  function todayText() {
    return "2026/10/18";
  }

  /* ============================================================
     DOM refs
     ============================================================ */
  const matrix = $("#matrix");
  const itemsLayer = $("#itemsLayer");
  const leaders = $("#leaders");
  const sidebar = $("#sidebar");
  const tooltip = $("#tooltip");
  const toastEl = $("#toast");

  const q1bg = $("#q1bg");
  const q2bg = $("#q2bg");
  const q3bg = $("#q3bg");
  const q4bg = $("#q4bg");
  const vLine = $("#vLine");
  const hLine = $("#hLine");

  const labelQ1 = $("#labelQ1");
  const labelQ2 = $("#labelQ2");
  const labelQ3 = $("#labelQ3");
  const labelQ4 = $("#labelQ4");
  const countQ1 = $("#countQ1");
  const countQ2 = $("#countQ2");
  const countQ3 = $("#countQ3");
  const countQ4 = $("#countQ4");
  const tabCount = $("#tabCount");

  /* ============================================================
     Geometry
     ============================================================ */
  const PAD = 14;
  function cardSizes(w) {
    if (w < 680) return {
      lg: { w: 156, h: 80 },
      md: { w: 142, h: 76 },
      sm: { w: 122, h: 62 }
    };
    if (w < 960) return {
      lg: { w: 178, h: 82 },
      md: { w: 160, h: 76 },
      sm: { w: 138, h: 62 }
    };
    return {
      lg: { w: 202, h: 90 },
      md: { w: 184, h: 82 },
      sm: { w: 158, h: 66 }
    };
  }

  function scoreToPx(task, w, h) {
    return {
      x: PAD + (task.urgency / 100) * (w - PAD * 2),
      y: PAD + ((100 - task.importance) / 100) * (h - PAD * 2)
    };
  }

  function pxToScore(cx, cy, w, h) {
    return {
      urgency: clamp(Math.round(((cx - PAD) / Math.max(1, w - PAD * 2)) * 100), 0, 100),
      importance: clamp(Math.round(100 - ((cy - PAD) / Math.max(1, h - PAD * 2)) * 100), 0, 100)
    };
  }

  function rectAt(x, y, w, h) {
    return { left: x, top: y, right: x + w, bottom: y + h, w, h };
  }

  function clampRect(rect, mw, mh, margin = 8) {
    const left = clamp(rect.left, margin, Math.max(margin, mw - rect.w - margin));
    const top = clamp(rect.top, margin, Math.max(margin, mh - rect.h - margin));
    return { left, top, right: left + rect.w, bottom: top + rect.h, w: rect.w, h: rect.h };
  }

  function rectsOverlap(a, b, gap = 6) {
    return !(a.right + gap <= b.left || a.left >= b.right + gap || a.bottom + gap <= b.top || a.top >= b.bottom + gap);
  }

  function anyOverlap(rect, list, gap = 6) {
    return list.some(r => rectsOverlap(rect, r, gap));
  }

  const OFFSETS = (() => {
    const out = [{ dx: 0, dy: 0 }];
    for (let r = 12; r <= 200; r += 12) {
      const n = 12;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + (r / 12) * 0.4;
        out.push({ dx: Math.cos(a) * r, dy: Math.sin(a) * r });
      }
    }
    return out;
  })();

  function quadrantAtPoint(cx, cy, w, h) {
    const s = pxToScore(cx, cy, w, h);
    return quadrantOf(s, state.threshold);
  }

  function findPlacement(anchor, size, obstacles, mw, mh, strictQuadrant, maxR = 56) {
    for (const off of OFFSETS) {
      const dist = Math.hypot(off.dx, off.dy);
      if (dist > maxR) continue;
      let rect = rectAt(anchor.x + off.dx - size.w / 2, anchor.y + off.dy - size.h / 2, size.w, size.h);
      rect = clampRect(rect, mw, mh, 8);
      if (anyOverlap(rect, obstacles, 7)) continue;
      if (strictQuadrant && quadrantAtPoint(rect.left + rect.w / 2, rect.top + rect.h / 2, mw, mh) !== strictQuadrant) continue;
      return { rect, offset: dist };
    }
    return null;
  }

  function labelWidths(w, threshold) {
    const maxW = w < 960 ? 180 : 250;
    const leftW = Math.max(150, Math.min(maxW, (threshold / 100) * w - 24));
    const rightW = Math.max(150, Math.min(maxW, ((100 - threshold) / 100) * w - 24));
    return { leftW, rightW };
  }

  function getLabelRects(w, h, threshold) {
    const { leftW, rightW } = labelWidths(w, threshold);
    const labelH = w < 960 ? 42 : 62;
    const topH = Math.min(labelH, ((100 - threshold) / 100) * h);
    const bottomH = Math.min(labelH, (threshold / 100) * h);
    return [
      { left: 16, top: 14, right: 16 + leftW, bottom: 14 + topH },
      { left: w - 16 - rightW, top: 14, right: w - 16, bottom: 14 + topH },
      { left: 16, top: h - 14 - bottomH, right: 16 + leftW, bottom: h - 14 },
      { left: w - 16 - rightW, top: h - 14 - bottomH, right: w - 16, bottom: h - 14 }
    ];
  }

  /* ============================================================
     Clusters
     ============================================================ */
  function buildClusters(unimportant, w, h) {
    const clusters = [];
    const sorted = [...unimportant].sort((a, b) => (b.urgency - a.urgency) || (b.importance - a.importance));

    for (const task of sorted) {
      const p = scoreToPx(task, w, h);
      let best = null;
      let bestDist = Infinity;
      for (const c of clusters) {
        const d = Math.hypot(p.x - c.cx, p.y - c.cy);
        if (d <= 30 && d < bestDist) { best = c; bestDist = d; }
      }
      if (best) {
        best.items.push(task);
        let sx = 0, sy = 0;
        for (const t of best.items) {
          const tp = scoreToPx(t, w, h);
          sx += tp.x; sy += tp.y;
        }
        best.cx = sx / best.items.length;
        best.cy = sy / best.items.length;
      } else {
        clusters.push({ id: task.id, items: [task], cx: p.x, cy: p.y });
      }
    }

    for (const c of clusters) {
      c.id = c.items.map(t => t.id).sort().join("|");
    }
    return clusters;
  }

  /* ============================================================
     Render matrix
     ============================================================ */
  function renderMatrix() {
    const w = matrix.clientWidth;
    const h = matrix.clientHeight;
    if (!w || !h) return;

    matrix.classList.toggle("narrow", w < 960);

    const T = state.threshold;
    const leftPct = T;
    const rightPct = 100 - T;
    const topPct = 100 - T;
    const bottomPct = T;

    q1bg.style.cssText = `left:${leftPct}%;top:0;width:${rightPct}%;height:${topPct}%`;
    q2bg.style.cssText = `left:0;top:0;width:${leftPct}%;height:${topPct}%`;
    q3bg.style.cssText = `left:${leftPct}%;top:${topPct}%;width:${rightPct}%;height:${bottomPct}%`;
    q4bg.style.cssText = `left:0;top:${topPct}%;width:${leftPct}%;height:${bottomPct}%`;
    vLine.style.left = leftPct + "%";
    hLine.style.top = topPct + "%";

    const { leftW, rightW } = labelWidths(w, T);
    labelQ2.style.width = leftW + "px";
    labelQ4.style.width = leftW + "px";
    labelQ1.style.width = rightW + "px";
    labelQ3.style.width = rightW + "px";
    labelQ1.classList.toggle("compact", rightW < 196);
    labelQ2.classList.toggle("compact", leftW < 196);
    labelQ3.classList.toggle("compact", rightW < 196);
    labelQ4.classList.toggle("compact", leftW < 196);

    itemsLayer.innerHTML = "";
    leaders.innerHTML = "";
    matrix.querySelectorAll(".cluster-popover, .popover-backdrop").forEach(el => el.remove());
    leaders.setAttribute("viewBox", `0 0 ${w} ${h}`);

    const active = state.tasks.filter(t => t.status === "active");
    const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
    for (const t of active) counts[quadrantOf(t)]++;
    countQ1.textContent = counts[1];
    countQ2.textContent = counts[2];
    countQ3.textContent = counts[3];
    countQ4.textContent = counts[4];
    tabCount.textContent = active.length;

    const important = active.filter(t => t.importance >= T);
    const unimportantAll = active.filter(t => t.importance < T);
    const selectedUnimportant = state.selectedId
      ? unimportantAll.find(t => t.id === state.selectedId) || null
      : null;
    const unimportant = selectedUnimportant
      ? unimportantAll.filter(t => t.id !== state.selectedId)
      : unimportantAll;

    const labelRects = getLabelRects(w, h, T);
    const clusters = buildClusters(unimportant, w, h);
    const clusterRects = [];
    const dotRects = [];
    const clusterLayouts = [];
    const dotLayouts = [];

    /* --- place multi-item cluster bubbles first --- */
    for (const cluster of clusters.filter(c => c.items.length > 1)) {
      const anchor = { x: cluster.cx, y: cluster.cy };
      const size = { w: 52, h: 32 };
      const placement = findPlacement(anchor, size, labelRects.concat(clusterRects), w, h, null, 30);
      const rect = placement ? placement.rect : clampRect(rectAt(anchor.x - size.w / 2, anchor.y - size.h / 2, size.w, size.h), w, h);
      clusterRects.push(rect);
      clusterLayouts.push({ cluster, rect });
    }

    /* --- singleton unimportant dots --- */
    for (const cluster of clusters.filter(c => c.items.length === 1)) {
      const task = cluster.items[0];
      const p = scoreToPx(task, w, h);
      let rect = clampRect(rectAt(p.x - 12, p.y - 12, 24, 24), w, h, 4);
      const obstacles = labelRects.concat(clusterRects, dotRects);
      if (anyOverlap(rect, obstacles, 3)) {
        for (const off of OFFSETS.slice(1, 28)) {
          const cand = clampRect(rectAt(p.x + off.dx - 12, p.y + off.dy - 12, 24, 24), w, h, 4);
          if (!anyOverlap(cand, obstacles, 3)) { rect = cand; break; }
        }
      }
      dotRects.push(rect);
      dotLayouts.push({ task, rect });
    }

    /* --- pull the selected unimportant task out of its cluster --- */
    if (selectedUnimportant) {
      const p = scoreToPx(selectedUnimportant, w, h);
      let rect = clampRect(rectAt(p.x - 12, p.y - 12, 24, 24), w, h, 4);
      const obstacles = labelRects.concat(clusterRects, dotRects);
      if (anyOverlap(rect, obstacles, 3)) {
        for (const off of OFFSETS.slice(1, 40)) {
          const cand = clampRect(rectAt(p.x + off.dx - 12, p.y + off.dy - 12, 24, 24), w, h, 4);
          if (!anyOverlap(cand, obstacles, 3)) { rect = cand; break; }
        }
      }
      dotRects.push(rect);
      dotLayouts.push({ task: selectedUnimportant, rect });
    }

    /* --- important cards, most important first --- */
    const placedCardRects = [];
    const cardLayouts = [];
    const sortedImportant = [...important].sort((a, b) =>
      (b.importance - a.importance) || (b.urgency - a.urgency) || a.id.localeCompare(b.id)
    );

    for (const task of sortedImportant) {
      const tier = task.importance >= 80 ? "lg" : task.importance >= 60 ? "md" : "sm";
      const size = cardSizes(w)[tier];
      const anchor = scoreToPx(task, w, h);
      const obstacles = labelRects.concat(clusterRects, dotRects, placedCardRects);
      const q = quadrantOf(task);
      const strict = findPlacement(anchor, size, obstacles, w, h, q, 200);
      const relaxed = strict || findPlacement(anchor, size, obstacles, w, h, null, 200);
      const placement = strict || relaxed;
      const rect = placement
        ? placement.rect
        : clampRect(rectAt(anchor.x - size.w / 2, anchor.y - size.h / 2, size.w, size.h), w, h);
      placedCardRects.push(rect);
      cardLayouts.push({ task, rect, tier, anchor });
    }

    /* --- leaders --- */
    const svgNS = "http://www.w3.org/2000/svg";
    for (const layout of cardLayouts) {
      const { task, rect, anchor } = layout;
      const cx = rect.left + rect.w / 2;
      const cy = rect.top + rect.h / 2;
      const dist = Math.hypot(cx - anchor.x, cy - anchor.y);
      if (dist > 6) {
        const q = quadrantOf(task);
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", anchor.x);
        line.setAttribute("y1", anchor.y);
        line.setAttribute("x2", cx);
        line.setAttribute("y2", cy);
        line.setAttribute("class", `leader q${q}`);
        leaders.appendChild(line);

        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("cx", anchor.x);
        dot.setAttribute("cy", anchor.y);
        dot.setAttribute("r", "2.8");
        dot.setAttribute("class", `anchor q${q}`);
        leaders.appendChild(dot);
      }
    }

    /* --- render clusters --- */
    for (const { cluster, rect } of clusterLayouts) {
      const urgent = cluster.items.filter(t => t.urgency >= T).length;
      const overdue = cluster.items.filter(isOverdue).length;
      const btn = document.createElement("button");
      btn.className = "cluster";
      btn.style.left = rect.left + "px";
      btn.style.top = rect.top + "px";
      btn.setAttribute("aria-label", `${cluster.items.length} unimportant items, ${urgent} urgent`);
      btn.innerHTML = `${urgent ? '<i class="urgent-dot"></i>' : ""}<span class="cluster-label">${cluster.items.length} items</span>${overdue ? '<i class="overdue-dot"></i>' : ""}`;

      btn.addEventListener("click", e => {
        e.stopPropagation();
        state.openClusterId = cluster.id;
        state.selectedId = null;
        renderAll();
      });
      btn.addEventListener("mouseenter", e => showTooltip(clusterTooltip(cluster), e.clientX, e.clientY));
      btn.addEventListener("mousemove", e => positionTooltip(e.clientX, e.clientY));
      btn.addEventListener("mouseleave", hideTooltip);
      itemsLayer.appendChild(btn);
    }

    /* --- render dots --- */
    for (const { task, rect } of dotLayouts) {
      const q = quadrantOf(task);
      const size = 9 + (task.urgency / 100) * 5;
      const hit = document.createElement("button");
      hit.className = `dot-hit q${q}${state.selectedId === task.id ? " selected" : ""}`;
      hit.style.left = rect.left + "px";
      hit.style.top = rect.top + "px";
      hit.setAttribute("aria-label", `${task.title}, importance ${task.importance}, urgency ${task.urgency}, not important`);
      hit.innerHTML = `<span class="micro-dot" style="width:${size}px;height:${size}px"></span>`;

      bindTaskInteraction(hit, task);
      itemsLayer.appendChild(hit);
    }

    /* --- render important cards --- */
    for (const layout of cardLayouts) {
      const { task, rect, tier } = layout;
      const q = quadrantOf(task);
      const card = document.createElement("article");
      card.className = `task-card q${q} ${tier}${state.selectedId === task.id ? " selected" : ""}`;
      card.style.left = rect.left + "px";
      card.style.top = rect.top + "px";
      card.style.width = rect.w + "px";
      card.style.height = rect.h + "px";
      card.style.zIndex = String(20 + Math.round(task.importance / 2));
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `${task.title}, importance ${task.importance}, urgency ${task.urgency}`);

      const due = dueInfo(task);
      card.innerHTML = `
        <div class="card-top">
          <h3>${escapeHtml(task.title)}</h3>
          <button class="complete-btn" title="Complete" aria-label="Complete">✓</button>
        </div>
        <div class="card-meta">
          ${due ? `<span class="due ${due.cls}">${due.text}</span>` : ""}
          <span class="tag-dots">${task.tags.map(t => `<i style="background:${TAG_COLORS[t] || "#999"}" title="${escapeHtml(t)}"></i>`).join("")}</span>
          <span class="score-mini">I ${task.importance} · U ${task.urgency}</span>
        </div>
      `;

      const completeBtn = $(".complete-btn", card);
      completeBtn.addEventListener("click", e => {
        e.stopPropagation();
        completeTask(task);
      });

      bindTaskInteraction(card, task);

      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectTask(task.id);
        }
      });

      itemsLayer.appendChild(card);
    }

    /* --- popover for the open cluster --- */
    if (state.openClusterId) {
      const cluster = clusters.find(c => c.id === state.openClusterId);
      const layout = clusterLayouts.find(l => l.cluster.id === state.openClusterId);
      if (cluster && layout) {
        renderClusterPopover(cluster, layout.rect, w, h);
      } else {
        state.openClusterId = null;
      }
    }
  }

  /* ============================================================
     Task interactions
     ============================================================ */
  function bindTaskInteraction(el, task) {
    el.addEventListener("click", e => {
      if (e.target.closest(".complete-btn")) return;
      selectTask(task.id);
    });
    el.addEventListener("mouseenter", e => showTooltip(taskTooltip(task), e.clientX, e.clientY));
    el.addEventListener("mousemove", e => positionTooltip(e.clientX, e.clientY));
    el.addEventListener("mouseleave", hideTooltip);
  }

  function selectTask(id) {
    state.selectedId = id;
    state.openClusterId = null;
    if (window.matchMedia("(max-width: 1040px)").matches) {
      document.body.classList.add("sidebar-open");
    }
    renderAll();
    requestAnimationFrame(() => {
      const panel = document.getElementById("detailPanel");
      if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  function clearSelection() {
    state.selectedId = null;
    state.openClusterId = null;
    renderAll();
    sidebar.scrollTop = 0;
  }

  function completeTask(task) {
    task.status = "completed";
    if (state.selectedId === task.id) state.selectedId = null;
    state.openClusterId = null;
    renderAll();
    showToast(`Completed “${task.title}”`);
  }

  function archiveTask(task) {
    task.status = "archived";
    if (state.selectedId === task.id) state.selectedId = null;
    state.openClusterId = null;
    renderAll();
    showToast(`Archived “${task.title}”`);
  }

  function deleteTask(task) {
    state.tasks = state.tasks.filter(t => t.id !== task.id);
    if (state.selectedId === task.id) state.selectedId = null;
    state.openClusterId = null;
    renderAll();
    showToast(`Deleted “${task.title}”`);
  }

  /* ============================================================
     Tooltip
     ============================================================ */
  function taskTooltip(task) {
    const due = dueInfo(task);
    const tagText = task.tags.length ? task.tags.join(" / ") : "";
    return `
      <div class="tt-title">${escapeHtml(task.title)}</div>
      <div class="tt-meta">Importance ${task.importance} · Urgency ${task.urgency}</div>
      ${(due || tagText) ? `<div class="tt-meta">${[due ? due.text : "", tagText].filter(Boolean).join(" · ")}</div>` : ""}
    `;
  }

  function clusterTooltip(cluster) {
    const urgent = cluster.items.filter(t => t.urgency >= state.threshold).length;
    const overdue = cluster.items.filter(isOverdue).length;
    const preview = cluster.items.slice(0, 4).map(t =>
      `<div>${escapeHtml(t.title)}<span>I${t.importance} U${t.urgency}</span></div>`
    ).join("");
    return `
      <div class="tt-title">${cluster.items.length} items · not important</div>
      <div class="tt-meta">${urgent} urgent${overdue ? ` · ${overdue} overdue` : ""}</div>
      <div class="tt-list">${preview}${cluster.items.length > 4 ? "<div>…</div>" : ""}</div>
      <div class="tt-foot">Click to expand</div>
    `;
  }

  function showTooltip(html, x, y) {
    tooltip.innerHTML = html;
    tooltip.style.opacity = "1";
    tooltip.style.visibility = "visible";
    positionTooltip(x, y);
  }

  function positionTooltip(x, y) {
    if (tooltip.style.visibility !== "visible") return;
    const r = tooltip.getBoundingClientRect();
    let left = x + 14;
    let top = y + 14;
    if (left + r.width > window.innerWidth - 12) left = x - r.width - 14;
    if (top + r.height > window.innerHeight - 12) top = y - r.height - 14;
    tooltip.style.left = Math.max(8, left) + "px";
    tooltip.style.top = Math.max(8, top) + "px";
  }

  function hideTooltip() {
    tooltip.style.opacity = "0";
    tooltip.style.visibility = "hidden";
  }

  /* ============================================================
     Cluster popover
     ============================================================ */
  function renderClusterPopover(cluster, bubbleRect, w, h) {
    const backdrop = document.createElement("div");
    backdrop.className = "popover-backdrop";
    backdrop.addEventListener("click", closePopover);
    matrix.appendChild(backdrop);

    const pop = document.createElement("div");
    pop.className = "cluster-popover";
    pop.addEventListener("click", e => e.stopPropagation());

    const urgent = cluster.items.filter(t => t.urgency >= state.threshold).length;
    const overdue = cluster.items.filter(isOverdue).length;

    pop.innerHTML = `
      <header>
        <strong>${cluster.items.length} items · not important</strong>
        <span>${urgent} urgent${overdue ? ` · ${overdue} overdue` : ""}</span>
      </header>
    `;

    for (const task of cluster.items) {
      const due = dueInfo(task);
      const item = document.createElement("button");
      item.className = "popover-item";
      item.innerHTML = `
        <span class="pi-title">${escapeHtml(task.title)}</span>
        <span class="pi-meta">
          <span>Importance ${task.importance} · Urgency ${task.urgency}</span>
          ${due ? `<span class="due ${due.cls}" style="height:15px;font-size:8.5px">${due.text}</span>` : ""}
        </span>
      `;
      item.addEventListener("click", () => {
        state.openClusterId = null;
        selectTask(task.id);
      });
      pop.appendChild(item);
    }

    const popW = 320;
    const popH = Math.min(300, 48 + cluster.items.length * 44);
    let left = clamp(bubbleRect.left + bubbleRect.w / 2 - popW / 2, 12, Math.max(12, w - popW - 12));
    let top = bubbleRect.bottom + 8;
    if (top + popH > h - 12) top = bubbleRect.top - popH - 8;
    if (top < 12) top = 12;

    pop.style.left = left + "px";
    pop.style.top = top + "px";
    matrix.appendChild(pop);
  }

  function closePopover() {
    state.openClusterId = null;
    renderMatrix();
  }

  /* ============================================================
     Sidebar
     ============================================================ */
  function renderSidebar() {
    const selected = state.tasks.find(t => t.id === state.selectedId && t.status === "active");

    sidebar.innerHTML = `
      <button class="sidebar-close" id="sidebarClose" aria-label="Close panel">×</button>
      <div class="panel">
        <h3>Visual controls</h3>
        <p class="panel-sub">Static data · Not connected · 2026/10/18</p>
        <div class="palette-switch" id="paletteSwitch">
          <button class="palette-btn${state.palette === "graphite" ? " active" : ""}" data-palette="graphite">
            <span class="swatches"><i style="background:#F04452"></i><i style="background:#0087EE"></i><i style="background:#FFB020"></i><i style="background:#7C8798"></i></span>
            <span class="palette-name">Graphite</span>
          </button>
          <button class="palette-btn${state.palette === "fog" ? " active" : ""}" data-palette="fog">
            <span class="swatches"><i style="background:#E03A47"></i><i style="background:#007FD4"></i><i style="background:#E0A100"></i><i style="background:#8492A6"></i></span>
            <span class="palette-name">Fog</span>
          </button>
        </div>

        <div class="field">
          <label for="thresholdRange">Quadrant threshold <output id="thresholdOut">${state.threshold}</output></label>
          <input id="thresholdRange" type="range" min="30" max="70" step="1" value="${state.threshold}">
          <div class="range-labels"><span>30</span><span>50</span><span>70</span></div>
        </div>

        <div class="legend">
          <div class="legend-row"><span class="legend-card"></span>Card = important · size = importance</div>
          <div class="legend-row"><span class="legend-dot"></span>Dot = not important · position preserved</div>
          <div class="legend-row"><span class="legend-bubble">N</span>Bubble = grouped · click to expand</div>
          <div class="legend-row"><span class="legend-line"></span>Line = true position after avoidance</div>
        </div>
      </div>

      <div class="panel">
        <h3>How to read</h3>
        <p>Position = importance / urgency. Important tasks are cards; unimportant tasks are dots. Dots that crowd together become a bubble. When a card is nudged away, a thin line connects it back to its true score.</p>
        <p class="hint">Try: open a card or dot, switch themes, move the threshold, open a cluster.</p>
      </div>

      ${selected ? detailPanel(selected) : ""}
    `;

    bindSidebar(selected);
  }

  function detailPanel(task) {
    const q = quadrantOf(task);
    const due = dueInfo(task);
    const tags = task.tags.map(t => `<span class="tag"><i style="background:${TAG_COLORS[t] || "#999"}"></i>${escapeHtml(t)}</span>`).join("");
    const independent = task.importance >= state.threshold;

    return `
      <div class="panel" id="detailPanel">
        <button class="back-link" id="backToIntro">← Back to overview</button>
        <div class="detail-head">
          <h3 class="detail-title">${escapeHtml(task.title)}</h3>
          <span class="badge q${q}" id="detailQuad">${QUADS[q].name}</span>
        </div>
        <div class="detail-meta">
          ${due ? `<span class="due ${due.cls}" id="detailDue">${due.text}</span>` : `<span class="due" id="detailDue" style="display:none"></span>`}
          ${tags || `<span class="hint" style="margin:0">No tags</span>`}
        </div>
        <p class="detail-visibility" id="detailVisibility">${independent ? "Independent card" : "Dot · not important"} · editing reflows live</p>

        <div class="detail-section">
          <label for="impRange">Importance <output id="impOut">${task.importance}</output></label>
          <div class="score-row">
            <input id="impRange" type="range" min="0" max="100" step="1" value="${task.importance}" style="accent-color:var(--important)">
            <input id="impNum" class="number-input" type="number" min="0" max="100" step="1" value="${task.importance}">
          </div>
        </div>

        <div class="detail-section">
          <label for="urgRange">Urgency <output id="urgOut">${task.urgency}</output></label>
          <div class="score-row">
            <input id="urgRange" type="range" min="0" max="100" step="1" value="${task.urgency}" style="accent-color:var(--urgent)">
            <input id="urgNum" class="number-input" type="number" min="0" max="100" step="1" value="${task.urgency}">
          </div>
        </div>

        <div class="detail-section">
          <label for="dueInput">Due date</label>
          <input id="dueInput" class="date-input" type="date" value="${task.due || ""}">
        </div>

        <div class="detail-section">
          <label>Tags</label>
          <div class="tag-list">${tags || `<span class="hint" style="margin:0">No tags</span>`}</div>
        </div>

        <div class="detail-section">
          <label for="notesInput">Notes</label>
          <textarea id="notesInput" placeholder="Add context…">${escapeHtml(task.notes)}</textarea>
        </div>

        <div class="detail-actions">
          <button class="btn primary" id="completeDetail">✓ Complete</button>
          <button class="btn" id="archiveDetail">Archive</button>
          <button class="btn danger" id="deleteDetail">Delete</button>
        </div>
        <p class="hint">Edit the scores here; the matrix reflows live.</p>
      </div>
    `;
  }

  function bindSidebar(task) {
    const closeBtn = $("#sidebarClose");
    if (closeBtn) closeBtn.addEventListener("click", () => document.body.classList.remove("sidebar-open"));

    /* palette */
    document.querySelectorAll(".palette-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.palette = btn.dataset.palette;
        document.body.dataset.palette = state.palette;
        document.querySelectorAll(".palette-btn").forEach(b => b.classList.toggle("active", b === btn));
        showToast(`Palette: ${btn.querySelector(".palette-name").textContent}`);
      });
    });

    /* threshold */
    const range = $("#thresholdRange");
    const out = $("#thresholdOut");
    if (range) {
      range.addEventListener("input", () => {
        state.threshold = Number(range.value);
        if (out) out.textContent = state.threshold;
        renderMatrix();
        if (task) updateDetailQuad(task);
      });
    }

    /* back */
    const back = $("#backToIntro");
    if (back) back.addEventListener("click", clearSelection);

    if (!task) return;

    const impRange = $("#impRange");
    const impNum = $("#impNum");
    const impOut = $("#impOut");
    const urgRange = $("#urgRange");
    const urgNum = $("#urgNum");
    const urgOut = $("#urgOut");

    const setImportance = value => {
      const n = roundScore(value);
      task.importance = n;
      if (impRange) impRange.value = n;
      if (impNum) impNum.value = n;
      if (impOut) impOut.textContent = n;
      renderMatrix();
      updateDetailQuad(task);
    };

    const setUrgency = value => {
      const n = roundScore(value);
      task.urgency = n;
      if (urgRange) urgRange.value = n;
      if (urgNum) urgNum.value = n;
      if (urgOut) urgOut.textContent = n;
      renderMatrix();
      updateDetailQuad(task);
    };

    if (impRange) impRange.addEventListener("input", e => setImportance(e.target.value));
    if (urgRange) urgRange.addEventListener("input", e => setUrgency(e.target.value));

    if (impNum) {
      impNum.addEventListener("change", e => setImportance(e.target.value));
      impNum.addEventListener("blur", e => setImportance(e.target.value));
    }
    if (urgNum) {
      urgNum.addEventListener("change", e => setUrgency(e.target.value));
      urgNum.addEventListener("blur", e => setUrgency(e.target.value));
    }

    const dueInput = $("#dueInput");
    if (dueInput) {
      dueInput.addEventListener("change", () => {
        task.due = dueInput.value || null;
        renderMatrix();
        const badge = $("#detailDue");
        if (badge) {
          const info = dueInfo(task);
          if (info) {
            badge.textContent = info.text;
            badge.className = `due ${info.cls}`;
            badge.style.display = "";
          } else {
            badge.style.display = "none";
          }
        }
      });
    }

    const notesInput = $("#notesInput");
    if (notesInput) {
      notesInput.addEventListener("input", () => { task.notes = notesInput.value; });
    }

    const complete = $("#completeDetail");
    if (complete) complete.addEventListener("click", () => completeTask(task));

    const archive = $("#archiveDetail");
    if (archive) archive.addEventListener("click", () => archiveTask(task));

    const del = $("#deleteDetail");
    if (del) del.addEventListener("click", () => deleteTask(task));
  }

  function updateDetailQuad(task) {
    const badge = $("#detailQuad");
    const visibility = $("#detailVisibility");
    if (!badge || !visibility || state.selectedId !== task.id) return;
    const q = quadrantOf(task);
    badge.className = `badge q${q}`;
    badge.textContent = QUADS[q].name;
    const independent = task.importance >= state.threshold;
    visibility.innerHTML = `${independent ? "Independent card" : "Dot · not important"} · editing reflows live`;
  }

  /* ============================================================
     Render all
     ============================================================ */
  function renderAll() {
    renderMatrix();
    renderSidebar();
  }

  /* ============================================================
     Toast
     ============================================================ */
  let toastTimer = null;
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  /* ============================================================
     Global events
     ============================================================ */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (document.body.classList.contains("sidebar-open")) {
        document.body.classList.remove("sidebar-open");
      } else if (state.openClusterId) {
        closePopover();
      } else if (state.selectedId) {
        clearSelection();
      }
    }
  });

  document.addEventListener("click", e => {
    if (state.openClusterId && !e.target.closest(".cluster-popover") && !e.target.closest(".cluster")) {
      closePopover();
    }
  });

  const addBtn = $("#addBtn");
  if (addBtn) addBtn.addEventListener("click", () => showToast("Visual draft: the add flow is not wired"));

  const settingsBtn = $("#settingsBtn");
  if (settingsBtn) settingsBtn.addEventListener("click", () => {
    if (window.matchMedia("(max-width: 1040px)").matches) {
      document.body.classList.toggle("sidebar-open");
      return;
    }
    const range = $("#thresholdRange");
    if (range) {
      range.focus();
      range.closest(".panel")?.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });

  const sidebarBackdrop = $("#sidebarBackdrop");
  if (sidebarBackdrop) {
    sidebarBackdrop.addEventListener("click", () => document.body.classList.remove("sidebar-open"));
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      if (tab.classList.contains("active")) return;
      showToast("Visual draft: only the In-progress view is shown");
    });
  });

  document.querySelectorAll(".tag-chip").forEach(chip => {
    chip.addEventListener("click", () => chip.classList.toggle("active"));
  });

  /* ============================================================
     Boot
     ============================================================ */
  renderAll();
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      renderMatrix();
    }).observe(matrix);
  }
})();
</script>
</body>
</html>
